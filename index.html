<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KalkLogam">
    <link rel="manifest" id="manifestLink">
    
    <title>Kalkulator Berat Logam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6 md:p-8">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Kalkulator Berat Logam</h1>
            <p class="text-sm text-gray-500">Hitung perkiraan berat berbagai jenis dan bentuk logam.</p>
        </div>

        <form id="calculatorForm" class="space-y-6">
            
            <!-- Pilih Logam -->
            <div>
                <label for="metalType" class="block text-sm font-medium text-gray-700 mb-1">Jenis Logam</label>
                <select id="metalType" class="w-full rounded-lg border-gray-300 border px-4 py-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                    <option value="7850">Baja Karbon (7850 kg/m³)</option>
                    <option value="7930">Baja Tahan Karat / Stainless Steel 304 (7930 kg/m³)</option>
                    <option value="2700">Aluminium (2700 kg/m³)</option>
                    <option value="8960">Tembaga (8960 kg/m³)</option>
                    <option value="8530">Kuningan (8530 kg/m³)</option>
                    <option value="7200">Besi Cor (7200 kg/m³)</option>
                    <option value="11340">Timbal (11340 kg/m³)</option>
                    <option value="19300">Emas murni (19300 kg/m³)</option>
                </select>
            </div>

            <!-- Pilih Bentuk -->
            <div>
                <label for="shapeType" class="block text-sm font-medium text-gray-700 mb-1">Bentuk Logam</label>
                <select id="shapeType" class="w-full rounded-lg border-gray-300 border px-4 py-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" onchange="updateInputFields()">
                    <option value="plate">Plat / Lembaran</option>
                    <option value="round_bar">Batang Bulat</option>
                    <option value="pipe">Pipa (Berongga)</option>
                    <option value="square_bar">Batang Persegi</option>
                </select>
            </div>

            <!-- Input Dinamis Berdasarkan Bentuk -->
            <div id="dynamicInputs" class="space-y-4 p-4 bg-gray-50 rounded-lg border border-gray-200 fade-in">
                <!-- Inputs akan di-generate oleh JS di sini -->
            </div>

            <!-- Input Harga -->
            <div>
                <label for="pricePerKg" class="block text-sm font-medium text-gray-700 mb-1">Harga per Kg (Rp) <span class="text-gray-400 font-normal">- Opsional</span></label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <span class="text-gray-500 sm:text-sm">Rp</span>
                    </div>
                    <input type="number" id="pricePerKg" class="w-full rounded-lg border-gray-300 border pl-10 pr-4 py-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="Contoh: 15000" min="0" step="any">
                </div>
            </div>

            <!-- Tombol Hitung -->
            <button type="button" onclick="calculateWeight()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Hitung Berat
            </button>
        </form>

        <!-- Hasil -->
        <div id="resultContainer" class="mt-8 hidden fade-in">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg shadow-sm">
                <div class="flex items-start">
                    <div class="flex-shrink-0 mt-1">
                        <!-- Icon -->
                        <svg class="h-6 w-6 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-4 w-full">
                        <div class="border-b border-blue-200 pb-2 mb-2 flex justify-between items-center">
                            <p id="resultLabel" class="text-sm text-blue-700 font-medium">Perkiraan Berat:</p>
                            <p id="resultWeight" class="text-xl font-bold text-blue-900">0.00 kg</p>
                        </div>
                        <div id="priceRow" class="flex justify-between items-center">
                            <p class="text-sm text-blue-700 font-medium">Estimasi Harga:</p>
                            <p id="resultPrice" class="text-xl font-bold text-green-600">Rp 0</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <p class="text-xs text-gray-400 mt-4 text-center">
                *Hasil ini adalah perkiraan teoretis. Berat aktual mungkin sedikit berbeda karena toleransi manufaktur dan paduan spesifik.
            </p>
        </div>

    </div>

    <script>
        // Fungsi pembantu untuk membuat dropdown satuan pada setiap input dimensi
        function createUnitSelect(id) {
            return `
                <select id="${id}" class="bg-gray-100 border border-gray-300 border-l-0 rounded-r px-2 py-2 text-sm text-gray-600 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                    <option value="mm">mm</option>
                    <option value="cm">cm</option>
                    <option value="m">m</option>
                </select>
            `;
        }

        // Fungsi untuk memperbarui field input berdasarkan bentuk yang dipilih
        function updateInputFields() {
            const shape = document.getElementById('shapeType').value;
            const container = document.getElementById('dynamicInputs');
            
            // Animasi transisi sederhana
            container.classList.remove('fade-in');
            void container.offsetWidth; // Trigger reflow
            container.classList.add('fade-in');

            let html = '';

            if (shape === 'plate') {
                html = `
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Panjang</label>
                            <div class="flex">
                                <input type="number" id="dimLength" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="1000" min="0" step="any">
                                ${createUnitSelect('unitLength')}
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Lebar</label>
                            <div class="flex">
                                <input type="number" id="dimWidth" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="1000" min="0" step="any">
                                ${createUnitSelect('unitWidth')}
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Ketebalan</label>
                        <div class="flex">
                            <input type="number" id="dimThickness" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="10" min="0" step="any">
                            ${createUnitSelect('unitThickness')}
                        </div>
                    </div>
                `;
            } else if (shape === 'round_bar') {
                html = `
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Diameter</label>
                        <div class="flex">
                            <input type="number" id="dimDiameter" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="50" min="0" step="any">
                            ${createUnitSelect('unitDiameter')}
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Panjang</label>
                        <div class="flex">
                            <input type="number" id="dimLength" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="6000" min="0" step="any">
                            ${createUnitSelect('unitLength')}
                        </div>
                    </div>
                `;
            } else if (shape === 'pipe') {
                html = `
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Diameter Luar</label>
                            <div class="flex">
                                <input type="number" id="dimOuterDiameter" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="100" min="0" step="any">
                                ${createUnitSelect('unitOuterDiameter')}
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Tebal Dinding</label>
                            <div class="flex">
                                <input type="number" id="dimWallThickness" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="5" min="0" step="any">
                                ${createUnitSelect('unitWallThickness')}
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Panjang</label>
                        <div class="flex">
                            <input type="number" id="dimLength" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="6000" min="0" step="any">
                            ${createUnitSelect('unitLength')}
                        </div>
                    </div>
                `;
            } else if (shape === 'square_bar') {
                html = `
                     <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Sisi</label>
                            <div class="flex">
                                <input type="number" id="dimSide" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="25" min="0" step="any">
                                ${createUnitSelect('unitSide')}
                            </div>
                        </div>
                         <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1">Panjang</label>
                            <div class="flex">
                                <input type="number" id="dimLength" class="w-full rounded-l border border-gray-300 px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="6000" min="0" step="any">
                                ${createUnitSelect('unitLength')}
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // Fungsi untuk menampilkan peringatan sementara (sebagai pengganti alert)
        function showMessage(msg) {
             const resultContainer = document.getElementById('resultContainer');
             const resultWeight = document.getElementById('resultWeight');
             const resultLabel = document.getElementById('resultLabel');
             const priceRow = document.getElementById('priceRow');
             
             resultContainer.classList.remove('hidden');
             // Ubah styling untuk menunjukkan error
             resultContainer.querySelector('.bg-blue-50').className = 'bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg shadow-sm';
             resultContainer.querySelector('svg').className.baseVal = 'h-6 w-6 text-red-500';
             resultLabel.className = 'text-sm text-red-700 font-medium';
             resultLabel.innerText = 'Perhatian:';
             
             resultWeight.className = 'text-lg font-semibold text-red-900 mt-1';
             resultWeight.innerText = msg;
             
             // Sembunyikan baris harga saat error
             if (priceRow) priceRow.style.display = 'none';
        }

        // Fungsi untuk mereset tampilan hasil ke mode normal (bukan error)
        function resetResultDisplay() {
             const resultContainer = document.getElementById('resultContainer');
             const resultLabel = document.getElementById('resultLabel');
             const priceRow = document.getElementById('priceRow');
             
             resultContainer.querySelector('.bg-red-50')?.setAttribute('class', 'bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg shadow-sm');
             resultContainer.querySelector('svg')?.setAttribute('class', 'h-6 w-6 text-blue-500');
             
             if(resultLabel) {
                 resultLabel.className = 'text-sm text-blue-700 font-medium';
                 resultLabel.innerText = 'Perkiraan Berat:';
             }
             
             const weightP = document.getElementById('resultWeight');
             if(weightP) {
                 weightP.className = 'text-xl font-bold text-blue-900';
             }
             
             // Tampilkan kembali baris harga secara default
             if (priceRow) priceRow.style.display = 'flex';
        }

        // Fungsi untuk menghitung berat
        function calculateWeight() {
            resetResultDisplay();
            
            const density = parseFloat(document.getElementById('metalType').value); // Massa jenis dalam kg/m³
            const shape = document.getElementById('shapeType').value;
            
            let volumeCubicMeters = 0;

            // Helper untuk mengambil nilai dan langsung mengubahnya ke Meter berdasarkan satuan masing-masing
            const getValInMeters = (idBase) => {
                const el = document.getElementById('dim' + idBase);
                if(!el || el.value === '') return null;
                const val = parseFloat(el.value);
                if(isNaN(val) || val <= 0) return -1; // Indikator error
                
                const unitEl = document.getElementById('unit' + idBase);
                const unit = unitEl ? unitEl.value : 'mm';
                
                if (unit === 'mm') return val / 1000;
                if (unit === 'cm') return val / 100;
                if (unit === 'm') return val;
                return val;
            };

            // Menghitung volume berdasarkan bentuk (dimensi sudah dalam meter)
            if (shape === 'plate') {
                const lengthM = getValInMeters('Length');
                const widthM = getValInMeters('Width');
                const thicknessM = getValInMeters('Thickness');
                
                if(lengthM === null || widthM === null || thicknessM === null) return showMessage("Mohon isi semua dimensi pelat.");
                if(lengthM === -1 || widthM === -1 || thicknessM === -1) return showMessage("Dimensi harus berupa angka positif.");

                volumeCubicMeters = lengthM * widthM * thicknessM;

            } else if (shape === 'round_bar') {
                const diameterM = getValInMeters('Diameter');
                const lengthM = getValInMeters('Length');

                if(diameterM === null || lengthM === null) return showMessage("Mohon isi semua dimensi batang bulat.");
                if(diameterM === -1 || lengthM === -1) return showMessage("Dimensi harus berupa angka positif.");

                const radiusM = diameterM / 2;
                
                // Volume silinder = π * r² * t
                volumeCubicMeters = Math.PI * Math.pow(radiusM, 2) * lengthM;

            } else if (shape === 'pipe') {
                const outerDiameterM = getValInMeters('OuterDiameter');
                const wallThicknessM = getValInMeters('WallThickness');
                const lengthM = getValInMeters('Length');

                if(outerDiameterM === null || wallThicknessM === null || lengthM === null) return showMessage("Mohon isi semua dimensi pipa.");
                if(outerDiameterM === -1 || wallThicknessM === -1 || lengthM === -1) return showMessage("Dimensi harus berupa angka positif.");
                
                if (wallThicknessM * 2 >= outerDiameterM) {
                    return showMessage("Tebal dinding terlalu besar untuk diameter luar ini (bukan pipa berongga).");
                }

                const outerRadiusM = outerDiameterM / 2;
                const innerRadiusM = (outerDiameterM - (2 * wallThicknessM)) / 2;

                // Volume pipa = Volume silinder luar - Volume silinder dalam
                const outerVolume = Math.PI * Math.pow(outerRadiusM, 2) * lengthM;
                const innerVolume = Math.PI * Math.pow(innerRadiusM, 2) * lengthM;
                volumeCubicMeters = outerVolume - innerVolume;

            } else if (shape === 'square_bar') {
                const sideM = getValInMeters('Side');
                const lengthM = getValInMeters('Length');

                if(sideM === null || lengthM === null) return showMessage("Mohon isi semua dimensi batang persegi.");
                if(sideM === -1 || lengthM === -1) return showMessage("Dimensi harus berupa angka positif.");

                volumeCubicMeters = sideM * sideM * lengthM;
            }

            // Hitung berat: Massa = Volume x Massa Jenis
            const weightKg = volumeCubicMeters * density;

            // Ambil Harga per Kg
            const priceInput = document.getElementById('pricePerKg').value;
            const pricePerKg = parseFloat(priceInput);
            let totalPrice = 0;
            let showPrice = false;

            if (!isNaN(pricePerKg) && pricePerKg > 0) {
                totalPrice = weightKg * pricePerKg;
                showPrice = true;
            }

            // Tampilkan hasil
            const resultContainer = document.getElementById('resultContainer');
            const resultWeight = document.getElementById('resultWeight');
            const resultPrice = document.getElementById('resultPrice');
            const priceRow = document.getElementById('priceRow');
            
            // Format angka berat
            let formattedWeight = weightKg.toFixed(2);
            if(weightKg < 0.01 && weightKg > 0) {
                 formattedWeight = weightKg.toFixed(4); // Tampilkan desimal lebih banyak jika sangat ringan
            } else if (weightKg > 1000) {
                 formattedWeight = new Intl.NumberFormat('id-ID').format(weightKg.toFixed(2));
            }

            resultWeight.innerText = `${formattedWeight} kg`;
            
            // Format dan tampilkan harga jika diisi
            if (showPrice) {
                resultPrice.innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(totalPrice);
                priceRow.style.display = 'flex';
            } else {
                priceRow.style.display = 'none'; // Sembunyikan jika harga tidak diinput
            }
            
            // Efek animasi muncul kembali
            resultContainer.classList.remove('hidden', 'fade-in');
            void resultContainer.offsetWidth; // Trigger reflow
            resultContainer.classList.add('fade-in');
        }

        // Inisialisasi input saat halaman pertama kali dimuat
        window.onload = function() {
            updateInputFields();
        };

        // Membuat PWA Manifest secara dinamis agar tetap dalam satu file
        const manifest = {
            "name": "Kalkulator Berat Logam",
            "short_name": "KalkLogam",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f3f4f6",
            "theme_color": "#2563eb",
            "description": "Aplikasi penghitung berat dan harga logam.",
            "icons": [{
                "src": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Circle-icons-calculator.svg/512px-Circle-icons-calculator.svg.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);

        // Catatan: Pendaftaran Service Worker via Blob dihapus karena browser modern 
        // memblokir penggunaan URL 'blob:' untuk Service Worker demi keamanan.
        // Jika Anda ingin meng-hosting aplikasi ini di web server sungguhan (menjadi PWA penuh), 
        // Anda perlu membuat file 'sw.js' secara terpisah.
    </script>
</body>
</html>
